[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A macOS menu bar resource monitor that costs almost nothing to run."
repository = "https://github.com/saddathasan/wisp"

[dependencies]
libc = "0.2.190"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
